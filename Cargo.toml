[package]
name = "harmonium"
version = "0.1.0"
edition = "2021"
description = "A GPUI-based agent orchestrator: projects, agents, and embedded terminals"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v0.217.5" }
alacritty_terminal = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
unicode-segmentation = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
