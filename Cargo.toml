[package]
name = "harmonium"
version = "0.1.0"
edition = "2021"
description = "A GPUI-based agent orchestrator: projects, agents, and embedded terminals"
license = "MIT"

[package.metadata.deb]
maintainer = "Till Ehrengruber <tehrengruber@users.noreply.github.com>"
copyright = "Harmonium contributors"
section = "devel"
priority = "optional"
# `$auto` resolves the libraries the binary links against (xcb, xkbcommon,
# glibc); wayland and vulkan are dlopened at runtime and have to be named.
depends = "$auto, libwayland-client0, libvulkan1, git"
recommends = "fonts-dejavu-core, mesa-vulkan-drivers"
# Not packaged by Ubuntu; installed from their own repositories.
suggests = "gh, claude-code"
extended-description = """\
Harmonium is a terminal emulator with orchestration UI on top: manage git \
projects, spawn coding agents into per-branch worktrees derived from a \
plain-language task description, and drive each agent through an embedded \
PTY terminal."""
assets = [
    ["target/release/harmonium", "usr/bin/", "755"],
    ["packaging/harmonium.desktop", "usr/share/applications/harmonium.desktop", "644"],
    ["README.md", "usr/share/doc/harmonium/README.md", "644"],
]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
alacritty_terminal = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
unicode-segmentation = "1"
shlex = "1"

[dev-dependencies]
# Drives windows and views without a compositor, which is the only way to
# test dialog and focus behaviour in this sandbox.
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
